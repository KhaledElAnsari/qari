# Publishes both packages to npm when a v* tag is pushed on a commit that is on main and passes CI.
# Needs the NPM_TOKEN repository secret. jsDelivr and unpkg pick up new versions automatically.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
