# qari demo on a VM with Nginx. See docs/deployment.md.
# 1. Copy demo/dist/ to /var/www/qari.  2. Replace reader.example.com with your domain.
# 3. sudo cp qari.conf /etc/nginx/sites-available/qari && sudo ln -s ../sites-available/qari /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx  5. HTTPS: sudo certbot --nginx -d reader.example.com
# Nginx drops a server's add_header lines inside any location that has its own add_header,
# so the shared headers live in one snippet that every location includes.

server {
    listen 80;
    server_name reader.example.com;
    root /var/www/qari;
    index index.html;

    # The 28.7 MB engine is about 7 MB compressed (text/html is always included).
    gzip on;
    gzip_types application/javascript application/json application/wasm;

    location / {
        include /etc/nginx/snippets/qari-headers.conf;
        # The page and the voice configs: always check for a newer copy, so a deploy shows up at once.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Built files carry a content hash in their name, so they never change: cache them for a year.
    # Quoted because a bare {8} would end the directive in Nginx.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|wasm)$" {
        include /etc/nginx/snippets/qari-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Voice files: the reader keeps its own copy (keyed by URL + version), so a day of HTTP caching is enough.
    location ~* \.onnx$ {
        include /etc/nginx/snippets/qari-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
