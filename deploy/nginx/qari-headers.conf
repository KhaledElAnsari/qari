# Shared headers for every qari location; install as /etc/nginx/snippets/qari-headers.conf.
# Cross-origin isolation: lets default mode use several CPU threads. Delete both lines to run single-threaded.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header X-Content-Type-Options "nosniff" always;
